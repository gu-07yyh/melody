<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心愿便利贴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #ffe4ef 0%, #ffd1e3 45%, #ffb8d0 100%);
      padding: 24px;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 48px 44px;
      box-shadow: 0 18px 45px rgba(255, 105, 158, 0.28);
      text-align: center;
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 10;
    }
    .heart {
      font-size: 44px;
      display: inline-block;
      animation: beat 1.4s ease-in-out infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }
    h1 {
      margin: 18px 0 8px;
      font-size: 30px;
      font-weight: 700;
      background: linear-gradient(90deg, #ff5e9a, #e73c7e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .sub { color: #c07a96; font-size: 14px; margin-bottom: 28px; }
    .field { position: relative; }
    input {
      width: 100%;
      padding: 15px 18px 15px 48px;
      font-size: 17px;
      border: 2px solid #ffc2d6;
      border-radius: 40px;
      outline: none;
      background: #fff;
      color: #8b3356;
      transition: border-color .25s, box-shadow .25s;
    }
    input::placeholder { color: #e3a8bf; }
    input:focus {
      border-color: #ff5e9a;
      box-shadow: 0 0 0 5px rgba(255, 94, 154, .18);
    }
    input.shake { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      50%      { transform: translateX(6px); }
      75%      { transform: translateX(-4px); }
    }
    .field::before {
      content: "♡";
      position: absolute;
      left: 20px; top: 50%;
      transform: translateY(-52%);
      color: #ff8fae;
      font-size: 18px;
      pointer-events: none;
    }
    button {
      margin-top: 22px;
      padding: 13px 44px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
      background: linear-gradient(90deg, #ff7aa8, #ff5e9a);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 94, 154, .35);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(255, 94, 154, .45); }
    button:active { transform: translateY(0); }

    /* —— 心愿便利贴 —— */
    .note {
      position: fixed;
      width: 172px;
      min-height: 150px;
      padding: 26px 18px 16px;
      border-radius: 3px;
      box-shadow: 0 6px 18px rgba(139, 51, 86, 0.18);
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      cursor: pointer;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }
    .note .tape {
      position: absolute;
      top: -10px; left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 64px; height: 22px;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 2px 5px rgba(0, 0, 0, .08);
      border-left: 1px dashed rgba(0, 0, 0, .06);
      border-right: 1px dashed rgba(0, 0, 0, .06);
    }
    .note .text { flex: 1; }
    .note .foot {
      font-size: 12px;
      opacity: .65;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .note .del { font-size: 15px; opacity: .7; transition: opacity .2s, transform .2s; }
    .note:hover .del { opacity: 1; }
    .note .del:hover { transform: scale(1.3); }

    .counter {
      position: fixed;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 13px;
      color: #c05a85;
      box-shadow: 0 4px 12px rgba(255, 105, 158, .18);
      transition: opacity .3s;
    }
    .counter.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="counter hidden" id="counter">墙上已有 <b id="count">0</b> 张心愿便利贴</div>

  <div class="card">
    <div class="heart">💗</div>
    <h1>心愿便利贴</h1>
    <p class="sub">把心愿写下来，它就有了形状</p>
    <div class="field">
      <input type="text" name="melody" placeholder="写下你的心愿" maxlength="50">
    </div>
    <button type="button" id="make">许下心愿</button>
  </div>

<script>
  const input = document.querySelector('input[name="melody"]');
  const btn = document.getElementById('make');
  const counter = document.getElementById('counter');
  const countEl = document.getElementById('count');
  const card = document.querySelector('.card');

  // 每组 = [底色, 渐变深色, 文字色]
  const COLORS = [
    ['#fff3b0', '#e6d485', '#9a8a45'], // 黄
    ['#ffd6e0', '#eeb4c2', '#a05a6d'], // 粉
    ['#b5ead7', '#93cdb7', '#477a63'], // 绿
    ['#c9e7ff', '#a7cceb', '#4a6f94'], // 蓝
    ['#e3d6ff', '#c7b4ea', '#6b5694'], // 紫
    ['#ffe0c2', '#ecc29e', '#9a6f45'], // 橙
  ];
  const MAX = 50;

  function rand(min, max) { return min + Math.random() * (max - min); }

  function makeNote(text) {
    if (count >= MAX) {
      btn.textContent = '墙满啦 💔';
      setTimeout(() => btn.textContent = '许下心愿', 1500);
      return;
    }

    const el = document.createElement('div');
    el.className = 'note';

    const palette = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.background = `linear-gradient(180deg, ${palette[0]}, ${palette[1]})`;
    el.style.color = palette[2];

    const rotate = Math.round(rand(-8, 8));
    el.innerHTML = `
      <span class="tape"></span>
      <span class="text"></span>
      <span class="foot"><span>♡</span><span class="del">✕</span></span>
    `;
    el.querySelector('.text').textContent = text;
    document.body.appendChild(el);

    // 随机落点（避开边缘）
    const W = el.offsetWidth, H = el.offsetHeight;
    const x = rand(20, window.innerWidth - W - 20);
    const y = rand(20, window.innerHeight - H - 20);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = `rotate(${rotate}deg)`;

    // 从卡片中心飞出的动画
    const rect = card.getBoundingClientRect();
    const fromX = rect.left + rect.width / 2 - (x + W / 2);
    const fromY = rect.top + rect.height / 2 - (y + H / 2);
    el.animate([
      { transform: `translate(${fromX}px, ${fromY}px) rotate(0deg) scale(0.4)`, opacity: 0 },
      { transform: `translate(0, 0) rotate(${rotate}deg) scale(1)`, opacity: 1 }
    ], {
      duration: 600,
      easing: 'cubic-bezier(.2, .9, .3, 1.12)'
    });

    // 点击便签撕掉
    el.addEventListener('click', () => {
      el.style.transition = 'transform .35s ease, opacity .35s ease';
      el.style.transform = `rotate(${rotate}deg) scale(.25)`;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 360);
      count--; countEl.textContent = count;
      if (count === 0) counter.classList.add('hidden');
    });

    count++; countEl.textContent = count;
    counter.classList.remove('hidden');
  }

  btn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) {
      input.classList.remove('shake');
      void input.offsetWidth; // 重触发动画
      input.classList.add('shake');
      input.placeholder = '先写下心愿再许愿吧～';
      setTimeout(() => { input.placeholder = '写下你的心愿'; }, 1500);
      input.focus();
      return;
    }
    makeNote(text);
    input.value = '';
    input.focus();
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') btn.click();
  });
</script>
</body>
</html>
